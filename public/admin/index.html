<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小说管理</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1419; color: #e7e9ea; min-height: 100vh;
    padding-bottom: 80px;
  }
  /* 顶部栏 */
  .header {
    background: #1a252f; padding: 16px; position: sticky; top: 0; z-index: 100;
    border-bottom: 1px solid #2c3e50;
  }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header .subtitle { font-size: 12px; color: #7f8c8d; margin-top: 4px; }

  /* 命令输入区 */
  .cmd-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    background: #1a252f; border-top: 1px solid #2c3e50;
    padding: 12px; display: flex; gap: 8px;
  }
  .cmd-input {
    flex: 1; padding: 12px 16px; border-radius: 24px;
    border: 1px solid #2c3e50; background: #0f1419;
    color: #e7e9ea; font-size: 15px; outline: none;
  }
  .cmd-input:focus { border-color: #3498db; }
  .cmd-input::placeholder { color: #7f8c8d; }
  .cmd-send {
    width: 44px; height: 44px; border-radius: 50%;
    background: #3498db; border: none; color: #fff;
    font-size: 20px; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
  }
  .cmd-send:active { background: #2980b9; }

  /* 快捷按钮区 */
  .quick-actions {
    display: flex; gap: 8px; padding: 12px 16px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .quick-btn {
    flex-shrink: 0; padding: 8px 16px; border-radius: 20px;
    background: #2c3e50; border: 1px solid #34495e;
    color: #ecf0f1; font-size: 13px; cursor: pointer;
    white-space: nowrap;
  }
  .quick-btn:active { background: #34495e; }
  .quick-btn.primary { background: #3498db; border-color: #3498db; }

  /* 内容区 */
  .content { padding: 16px; }
  .section-title {
    font-size: 14px; color: #7f8c8d; margin-bottom: 12px;
    text-transform: uppercase; letter-spacing: 1px;
  }

  /* 小说卡片 */
  .novel-card {
    background: #1a252f; border-radius: 12px; padding: 16px;
    margin-bottom: 12px; border: 1px solid #2c3e50;
  }
  .novel-card .title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .novel-card .meta { font-size: 12px; color: #7f8c8d; margin-bottom: 10px; }
  .novel-card .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .novel-card .actions button {
    padding: 6px 12px; border-radius: 6px; border: none;
    font-size: 12px; cursor: pointer;
  }
  .btn-view { background: #3498db; color: #fff; }
  .btn-add { background: #27ae60; color: #fff; }
  .btn-del { background: #c0392b; color: #fff; }
  .btn-edit { background: #f39c12; color: #fff; }

  /* 章节列表 */
  .chapter-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: #1a252f; border-radius: 8px;
    margin-bottom: 8px; border: 1px solid #2c3e50;
  }
  .chapter-item .ch-title { font-size: 14px; flex: 1; }
  .chapter-item .ch-num { font-size: 12px; color: #7f8c8d; margin-right: 12px; }
  .chapter-item .ch-del {
    width: 32px; height: 32px; border-radius: 50%;
    background: #c0392b; border: none; color: #fff;
    font-size: 16px; cursor: pointer;
  }

  /* 响应结果 */
  .response {
    background: #1a252f; border-radius: 12px; padding: 16px;
    margin-bottom: 16px; border-left: 3px solid #3498db;
    font-size: 14px; line-height: 1.6; white-space: pre-wrap;
  }
  .response.error { border-left-color: #c0392b; color: #e74c3c; }
  .response.success { border-left-color: #27ae60; }

  /* 空状态 */
  .empty { text-align: center; padding: 40px 20px; color: #7f8c8d; }
  .empty .icon { font-size: 48px; margin-bottom: 12px; }

  /* 加载 */
  .loading { text-align: center; padding: 20px; color: #7f8c8d; }
  .spinner {
    display: inline-block; width: 24px; height: 24px;
    border: 3px solid #2c3e50; border-top-color: #3498db;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 模态框 */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.7); align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #1a252f; border-radius: 16px; padding: 24px;
    width: 100%; max-width: 400px; max-height: 80vh; overflow-y: auto;
  }
  .modal h2 { font-size: 18px; margin-bottom: 16px; }
  .modal textarea {
    width: 100%; padding: 12px; border-radius: 8px;
    border: 1px solid #2c3e50; background: #0f1419;
    color: #e7e9ea; font-size: 14px; resize: vertical;
    min-height: 120px; outline: none;
  }
  .modal textarea:focus { border-color: #3498db; }
  .modal-actions { display: flex; gap: 12px; margin-top: 16px; justify-content: flex-end; }
  .modal-actions button {
    padding: 10px 20px; border-radius: 8px; border: none;
    font-size: 14px; cursor: pointer;
  }
  .modal-cancel { background: #2c3e50; color: #ecf0f1; }
  .modal-confirm { background: #3498db; color: #fff; }
</style>
</head>
<body>

<div class="header">
  <h1>📚 小说管理</h1>
  <div class="subtitle">命令输入 · 按钮操作 · 移动端优先</div>
</div>

<!-- 快捷按钮 -->
<div class="quick-actions">
  <button class="quick-btn primary" onclick="execCmd('列举所有小说')">📋 列举小说</button>
  <button class="quick-btn" onclick="execCmd('查看大纲')">📖 查看大纲</button>
  <button class="quick-btn" onclick="showAddChapter()">➕ 追加章节</button>
  <button class="quick-btn" onclick="execCmd('检查一致性')">🔍 检查一致性</button>
  <button class="quick-btn" onclick="execCmd('查看角色')">👥 查看角色</button>
</div>

<!-- 内容区 -->
<div class="content" id="content">
  <div class="empty">
    <div class="icon">📚</div>
    <div>输入命令或点击按钮开始管理</div>
    <div style="font-size:12px;margin-top:8px;color:#555">试试："列举所有小说"</div>
  </div>
</div>

<!-- 命令输入栏 -->
<div class="cmd-bar">
  <input type="text" class="cmd-input" id="cmdInput" placeholder="输入命令..." autocomplete="off">
  <button class="cmd-send" onclick="sendCmd()">➤</button>
</div>

<!-- 追加章节模态框 -->
<div class="modal-overlay" id="addChapterModal">
  <div class="modal">
    <h2>➕ 追加章节</h2>
    <input type="text" class="cmd-input" id="newChTitle" placeholder="章节标题" style="margin-bottom:12px;width:100%">
    <textarea id="newChContent" placeholder="章节内容..."></textarea>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeModal()">取消</button>
      <button class="modal-confirm" onclick="confirmAddChapter()">确认</button>
    </div>
  </div>
</div>

<script>
const API_BASE = '/api/novel'; // 后端 API 基础路径（需根据实际调整）

// 命令解析与执行
function execCmd(cmd) {
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading"><div class="spinner"></div><div style="margin-top:12px">处理中...</div></div>';

  // 模拟 API 调用（实际需对接后端）
  setTimeout(() => {
    let response = '';
    let isError = false;

    if (cmd.includes('列举')) {
      response = '📋 小说列表：\n\n1. 《以笔行侠》- 15 章\n2. 《魔法数学王国》- 8 章\n3. 《星际探险记》- 12 章';
    } else if (cmd.includes('大纲')) {
      response = '📖 当前小说大纲：\n\n第一卷：初入江湖\n- 第1章：意外穿越\n- 第2章：结识伙伴\n...\n\n第二卷：成长历练\n- 第6章：首次战斗\n...';
    } else if (cmd.includes('角色')) {
      response = '👥 角色列表：\n\n• 张三（主角）- 15岁少年\n• 李四（师傅）- 神秘老者\n• 王五（反派）- 黑暗势力首领';
    } else if (cmd.includes('检查')) {
      response = ' 一致性检查：\n\n✅ 章节连续性：通过\n✅ 角色一致性：通过\n️ 时间线：第3章与第5章存在冲突';
      isError = false;
    } else {
      response = ' 无法识别的命令：' + cmd + '\n\n支持的命令：\n• 列举所有小说\n• 查看大纲\n• 查看角色\n• 检查一致性\n• 追加章节\n• 删除章节';
      isError = true;
    }

    content.innerHTML = `<div class="response ${isError ? 'error' : 'success'}">${response}</div>`;
  }, 500);
}

function sendCmd() {
  const input = document.getElementById('cmdInput');
  const cmd = input.value.trim();
  if (!cmd) return;
  input.value = '';
  execCmd(cmd);
}

// 回车发送
document.getElementById('cmdInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') sendCmd();
});

// 追加章节
function showAddChapter() {
  document.getElementById('addChapterModal').classList.add('show');
}
function closeModal() {
  document.getElementById('addChapterModal').classList.remove('show');
}
function confirmAddChapter() {
  const title = document.getElementById('newChTitle').value.trim();
  const content = document.getElementById('newChContent').value.trim();
  if (!title || !content) {
    alert('请填写标题和内容');
    return;
  }
  closeModal();
  execCmd('追加章节：' + title);
  document.getElementById('newChTitle').value = '';
  document.getElementById('newChContent').value = '';
}

// 点击遮罩关闭
document.getElementById('addChapterModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
</script>

</body>
</html>
