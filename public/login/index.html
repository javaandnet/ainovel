<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>登录 · 小说管理</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#0f1419; color:#e7e9ea; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { width:100%; max-width:380px; background:#1a252f; border:1px solid #2c3e50; border-radius:16px; padding:28px 24px; }
  .logo { font-size:22px; font-weight:600; text-align:center; margin-bottom:4px; }
  .sub { font-size:13px; color:#7f8c8d; text-align:center; margin-bottom:22px; }
  .field { margin-bottom:14px; }
  .field label { display:block; font-size:12px; color:#95a5a6; margin-bottom:6px; }
  .field input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid #2c3e50; background:#0f1419; color:#e7e9ea; font-size:15px; outline:none; }
  .field input:focus { border-color:#3498db; }
  .btn { width:100%; padding:14px; border:none; border-radius:10px; background:#3498db; color:#fff; font-size:16px; font-weight:600; cursor:pointer; margin-top:6px; }
  .btn:active { background:#2472a4; }
  .btn:disabled { opacity:.6; }
  .msg { min-height:20px; font-size:13px; margin-top:14px; text-align:center; color:#e74c3c; }
  .msg.ok { color:#27ae60; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">📚 小说管理</div>
    <div class="sub">请登录后进入创作管理</div>
    <form id="f" autocomplete="on">
      <div class="field"><label>用户名</label><input id="u" type="text" autocomplete="username" required></div>
      <div class="field"><label>密码</label><input id="p" type="password" autocomplete="current-password" required></div>
      <button class="btn" id="go" type="submit">登 录</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>
<script>
const $ = (s) => document.querySelector(s);
/* 登录后去向：优先回跳 next（仅允许站内 /novel/ 或 /admin/ 前缀，防开放重定向），否则按角色落地 */
const NEXT = (() => {
  try { const n = new URLSearchParams(location.search).get('next') || ''; return /^\/(novel|admin)\//.test(n) ? n : ''; } catch { return ''; }
})();
const homeFor = (u) => NEXT || ((u && u.role === 'superadmin') ? '/admin/dashboard.html' : '/admin/');
async function toMe() {
  try { const r = await fetch('/api/me'); const j = await r.json(); if (j && j.user) { location.replace(homeFor(j.user)); return true; } } catch {}
  return false;
}
$('#f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = $('#msg'); msg.className = 'msg'; msg.textContent = '';
  const username = $('#u').value.trim(), password = $('#p').value;
  if (!username || !password) { msg.textContent = '请输入用户名和密码'; return; }
  $('#go').disabled = true; $('#go').textContent = '登录中…';
  try {
    const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username, password }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || ('登录失败 (' + r.status + ')'));
    msg.className = 'msg ok'; msg.textContent = '登录成功，进入中…';
    location.replace(homeFor(j.user));
  } catch (err) {
    msg.textContent = err.message; $('#go').disabled = false; $('#go').textContent = '登 录';
  }
});
toMe();
</script>
</body>
</html>
